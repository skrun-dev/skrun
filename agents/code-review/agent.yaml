name: code-review
version: 1.1.1

model:
  provider: google
  name: gemini-3.8-flash
  fallback:
    provider: google
    name: gemini-3.5-flash-lite

inputs:
  - name: code
    type: string
    required: true
    description: The code to review

outputs:
  - name: review
    type: string
    description: Summary of code quality
  - name: issues
    type: array
    description: List of issues found
  - name: score
    type: number
    description: Code quality score 0-100

environment:
  networking:
    allowed_hosts: []
  timeout: 60s

state:
  type: none
  ttl: 30d

tests:
  - name: basic-review
    input:
      code: "function add(a, b) { return a + b; }"
    assert: output.score >= 0
