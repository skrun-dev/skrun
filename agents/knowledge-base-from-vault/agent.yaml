name: knowledge-base-from-vault
version: 0.5.1
# v0.5.0: one state notebook per caller (scope: per_caller).
# v0.4.0: Gemini 3.8 Flash, with Gemini 3.5 Flash-Lite as fallback.
# v0.3.0: one script builds the whole site and counts it. The model passes the
# run's input to build_knowledge_base and answers with what it returns — it
# writes no HTML and counts nothing. read_vault and build_site_zip are gone.
# v0.2.0: deps auto-resolved by the Skrun runtime via package.json (jszip).

model:
  provider: google
  name: gemini-3.8-flash
  fallback:
    provider: google
    name: gemini-3.5-flash-lite

# The first model turn must call the one tool that builds the site.
tool_choice: build_knowledge_base

tools:
  - name: build_knowledge_base
    description: Build the whole knowledge base in one call. Reads every `.md` note of the vault, renders one HTML page per note plus `index.html` (all notes, concept index, stats), bundles them with the theme stylesheet as `kb.zip` in the run's output directory, and merges this run's concepts into the concept graph. Returns the agent's answer as one JSON object — site_zip_path, pages_count, concept_count, link_count, runs_processed, file_count, bytes and _state (the state to keep for the next run) — or { "error" } when nothing was built.
    input_schema:
      type: object
      properties:
        vault_dir:
          type: string
          description: The input's vault_dir, as given — a directory of Markdown notes, scanned recursively.
        site_title:
          type: string
          description: The input's site_title, as given. Optional - "Knowledge Base" when omitted.
        theme:
          type: string
          description: The input's theme, as given - light, dark or sepia. Optional - light when omitted.
        previous_state:
          type: object
          description: The Previous state this run received, unchanged. Omit it when the run received none.
          properties:
            runs_processed:
              type: number
            concepts:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  label:
                    type: string
                  count:
                    type: number
                  first_seen_run:
                    type: string
                  last_seen_run:
                    type: string
      required: [vault_dir]
      additionalProperties: false

inputs:
  - name: vault_dir
    type: string
    required: true
    description: Path to a directory of Markdown notes (e.g., "./fixtures/sample-vault" or "/home/me/Documents/Obsidian/MyVault").
  - name: site_title
    type: string
    required: false
    description: Title for the generated knowledge base. Defaults to "Knowledge Base".
  - name: theme
    type: string
    required: false
    description: Visual theme - "light" (default), "dark", or "sepia".

outputs:
  - name: site_zip_path
    type: string
    description: Path to the generated kb.zip in the run output directory.
  - name: concept_count
    type: number
    description: Number of distinct concepts in the knowledge graph after this run.
  - name: link_count
    type: number
    description: Total internal links resolved between notes.
  - name: pages_count
    type: number
    description: Number of pages in the bundled site.
  - name: runs_processed
    type: number
    description: How many times this agent has been run against any vault (from persistent state).

environment:
  networking:
    allowed_hosts: []
  timeout: 240s

state:
  type: kv
  scope: per_caller
  ttl: 90d

tests:
  - name: small-vault-light
    input:
      vault_dir: ./fixtures/sample-vault
      site_title: Skrun KB demo
    assert: output.pages_count >= 5
  - name: dark-theme
    input:
      vault_dir: ./fixtures/sample-vault
      site_title: Skrun KB demo
      theme: dark
    assert: output.concept_count > 0
